services:
  - type: web
    name: zerohuman-eval-platform
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/exams
    envVars:
      - key: PIONEER_API_KEY
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LINQ_API_KEY
        sync: false
      - key: SUPERSERVE_API_KEY
        sync: false
